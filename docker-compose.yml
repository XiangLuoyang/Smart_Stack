# Smart Stack 工作台编排
#
# 默认启动后端 API + 前端工作台(纯 Docker 一键启动):
#     docker compose up -d --build
#     打开 http://localhost:5173
#
# 可选:附带启动旧版 Streamlit 单页应用 (smart-trade.py,端口 8501)
#     docker compose --profile legacy up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: smart-stack-backend:latest
    container_name: smart-stack-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # SQLite + 自选列表持久化(config.py 的 DATA_DIR 解析为 /app/data)
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # 容器内允许前端(同源经 nginx 代理)访问
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:80","http://127.0.0.1:5173"]'
      PYTHONPATH: /app/backend:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - smart-stack

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: smart-stack-frontend:latest
    container_name: smart-stack-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smart-stack

  # ===== 可选:旧版 Streamlit 单页应用 =====
  # 用 `docker compose --profile legacy up` 启动;默认不会运行
  streamlit:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-stack-streamlit:latest
    container_name: smart-stack-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./smart-trade.py:/app/smart-trade.py
      - ./requirements.txt:/app/requirements.txt
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smart-stack

networks:
  smart-stack:
    driver: bridge
